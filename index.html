p it and you sound\\nrude, not casual.\\n\\nTwo survival reflexes to over-learn:\\n\\n- **बुझिनँ** (`bujhina`) — \\"I didn\'t understand.\\" Say it early and often.\\n- **बिस्तारै भन्नुहोस्** (`bistarai bhannuhos`) — \\"Please say it slowly.\\"\\n\\n`माफ गर्नुहोस्` opens almost any interaction with a stranger — it covers both\\n\\"excuse me\\" (to get attention) and \\"sorry\\" (to apologise).","source_path":"C:\\\\Users\\\\phill\\\\OneDrive\\\\Documents\\\\Code\\\\Scratch\\\\Nepali\\\\content\\\\lessons\\\\day02-survival-phrases.md"},"day03-core-words":{"id":"day03-core-words","title":"Day 3: First 100 Core Words","week":1,"day":3,"skill_type":"vocab","tags":["core-vocab"],"vocab_categories":["people","food","places","time","feelings"],"difficulty":1,"prerequisites":["day01-pronunciation"],"estimated_minutes":45,"status":"final","vocab_count":44,"pattern_count":3,"span_count":7,"character_count":0,"has_audio_content":true,"progress_status":"not_started","times_practiced":0,"due_vocab_count":0,"vocab":[{"id":"मान्छे-people","devanagari":"मान्छे","romanized":"manchhe","english":"person","category":"people","notes":"alt: manche","alt_romanizations":["manche"],"source_lesson_id":"day03-core-words","introduced_week":1},{"id":"केटा-people","devanagari":"केटा","romanized":"keta","english":"boy","category":"people","notes":null,"alt_romanizations":[],"source_lesson_id":"day03-core-words","introduced_week":1},{"id":"केटी-people","devanagari":"केटी","romanized":"keti","english":"girl","category":"people","notes":null,"alt_romanizations":[],"source_lesson_id":"day03-core-words","introduced_week":1},{"id":"आमा-people","devanagari":"आमा","romanized":"aama","english":"mother","category":"people","notes":"alt: ama","alt_romanizations":["ama"],"source_lesson_id":"day03-core-words","introduced_week":1},{"id":"बुबा-people","devanagari":"बुबा","romanized":"buba","english":"father","category":"people","notes":null,"alt_romanizations":[],"source_lesson_id":"day03-core-words","introduce :"मेरो घर","blank_romanized":"mero ghar"},{"devanagari":"यो मेरो परिवार हो","romanized":"Yo mero pariwar ho","english":"This is my family","blank_devanagari":"मेरो परिवार","blank_romanized":"mero pariwar"},{"devanagari":"यो मेरो साथी हो","romanized":"Yo mero saathi ho","english":"This is my friend","blank_devanagari":"मेरो साथी","blank_romanized":"mero saathi"}]},{"id":"day03-core-words:pattern:masanga-chha","template_devanagari":"मसँग ___ छ","template_romanized":"Masanga ___ chha","template_english":"I have ___","examples":[{"devanagari":"मसँग पैसा छ","romanized":"Masanga paisa chha","english":"I have money","blank_devanagari":"पैसा","blank_romanized":"paisa"},{"devanagari":"मसँग समय छ","romanized":"Masanga samaya chha","english":"I have time","blank_devanagari":"समय","blank_romanized":"samaya"},{"devanagari":"मसँग एउटा प्रश्न छ","romanized":"Masanga euta prashna chha","english":"I have a question","blank_devanagari":"एउटा प्रश्न","blank_romanized":"euta prashna"}]},{"id":"day03-core-words:pattern:ma-aaja","template_devanagari":"म आज ___","template_romanized":"Ma aaja ___","template_english":"Today I ___","examples":[{"devanagari":"म आज भात खान्छु","romanized":"Ma aaja bhaat khanchhu","english":"Today I eat rice","blank_devanagari":"भात खान्छु","blank_romanized":"bhaat khanchhu"},{"devanagari":"म आज बजार जान्छु","romanized":"Ma aaja bajar janchhu","english":"Today I go to the market","blank_devanagari":"बजार जान्छु","blank_romanized":"bajar janchhu"},{"devanagari":"म आज घरमा बस्छु","romanized":"Ma aaja gharma baschhu","english":"Today I stay home","blank_devanagari":"घरमा बस्छु","blank_romanized":"gharma baschhu"}]}],"turns":[{"turn_index":0,"speaker":"Maya","spans":[{"id":"day03-core-words:0:0","turn_index":0,"span_index":0,"devanagari":"यो मेरो परिवार हो।","romanized":"Yo mero pariwar ho.","english":"This is my family."},{"id":"day03-core-words:0:1","turn_index":0,"span_index":1,"devanagari":"यो मेरी आमा हुनुहुन्छ।","romanized":"Yo meri aama hunuhunchha.","english":"This is my mother."}]},{"turn_index":1,"speaker":"Kiran","spans":[{"id":"day03-core-words:1:0","turn_index":1,"span_index":0,"devanagari":"तपाईंको घरमा कति जना हुनुहुन्छ?","romanized":"Tapaiko gharma kati jana hunuhunchha?","english":"How many people are in your house?"}]},{"turn_index":2,"speaker":"Maya","spans":[{"id":"day03-core-words:2:0","turn_index":2,"span_index":0,"devanagari":"हामी पाँच जना छौं।","romanized":"Haami panch jana chhaun.","english":"We are five people."},{"id":"day03-core-words:2:1","turn_index":2,"span_index":1,"devanagari":"आमा, बुबा, दाइ, बहिनी र म।","romanized":"Aama, buba, dai, bahini ra ma.","english":"Mother, father, older brother, younger sister, and me."}]},{"turn_index":3,"speaker":"Kiran","spans":[{"id":"day03-core-words:3:0","turn_index":3,"span_index":0,"devanagari":"राम्रो!","romanized":"Ramro!","english":"Nice!"},{"id":"day03-core-words:3:1","turn_index":3,"span_index":1,"devanagari":"मेरो परिवार सानो छ।","romanized":"Mero pariwar sano chha.","english":"My family is small."}]}],"characters":[],"is_dialogue":true,"notes_markdown":"## Notes\\nThis is a pure vocabulary day. The words here are the ones that show up in\\nalmost every sentence you will ever say: family members, everyday food, common\\nplaces, and the words for \\"today / tomorrow / yesterday / now\\". Learn them as\\nflashcards first, then come back and read the dialogue.\\n\\nA few notes on the words:\\n\\n- **आमा / बुबा** are \\"mother / father\\" as address terms too — you call your own\\n  parents this directly.\\n- Older and younger siblings have different words: **दाइ / दिदी** (older\\n  brother / sister) vs **भाइ / बहिनी** (younger). Nepali speakers also use\\n  दाइ / दिदी for slightly older strangers as a politeness.\\n- **भात** is cooked rice on the plate; **चामल** is uncooked rice in the sack.\\n  Different words, and mixing them up is a classic beginner tell.\\n- The verb still lands at the end: \\"I eat rice today\\" → *म आज भात खान्छु*\\n  (I today rice eat).","source_path":"C:\\\\Users\\\\phill\\\\OneDrive\\\\Documents\\\\Code\\\\Scratch\\\\Nepali\\\\content\\\\lessons\\\\day03-core-words.md"},"day04-sentence-patterns":{"id":"day04-sentence-patterns","title":"Day 4: The Core Sentence Templates","week":1,"day":4,"skill_type":"sentence-pattern","tags":["templates","production"],"vocab_categories":["people","food","places","verbs"],"difficulty":1,"prerequisites":["day01-pronunciation"],"estimated_minutes":60,"status":"sample","vocab_count":10,"pattern_count":4,"span_count":2,"character_count":0,"has_audio_content":true,"progress_status":"not_started","times_practiced":0,"due_vocab_count":0,"vocab":[{"id":"विद्यार्थी-people","devanagari":"विद्यार्थी","romanized":"bidyarthi","english":"student","category":"people","notes":"alt: vidyarthi","alt_romanizations":["vidyarthi"],"source_lesson_id":"day04-sentence-patterns","introduced_week":1},{"id":"अमेरिकी-people","devanagari":"अमेरिकी","romanized":"amerikee","english":"American","category":"people","notes":"alt: ameriki","alt_romanizations":["ameriki"],"source_lesson_id":"day04-sentence-patterns","introduced_week":1},{"id":"चिया-food","devanagari":"चिया","romanized":"chiya","english":"tea","category":"food","notes":null,"alt_romanizations":[],"source_lesson_id":"day04-sentence-patterns","introduced_week":1},{"id":"भात-food","devanagari":"भात","romanized":"bhaat","english":"cooked rice","category":"food","notes":"alt: bhat","alt_romanizations":["bhat"],"source_lesson_id":"day04-sentence-patterns","introduced_week":1},{"id":"खाना-food","devanagari":"खाना","romanized":"khaana","english":"food / meal","category":"food","notes":"alt: khana","alt_romanizations":["khana"],"source_lesson_id":"day04-sentence-patterns","introduced_week":1},{"id":"पानी-food","devanagari":"पानी","romanized":"paani","english":"water","category":"food","notes":"alt: pani","alt_romanizations":["pani"],"source_lesson_id":"day04-sentence-patterns","introduced_week":1},{"id":"नेपाल-places","devanagari":"न day is about\\nverbs and the **present habitual** tense — the one you use for \\"I eat rice\\",\\n\\"I go to work\\", \\"I get up early\\".\\n\\nThe pattern for regular verbs, first person:\\n\\n- Take the dictionary form: **खानु** (`khanu`, \\"to eat\\")\\n- Drop `-नु`, add `-न्छु`: **खान्छु** (`khanchhu`, \\"I eat\\")\\n\\nPolite second person swaps in `-नुहुन्छ`: **तपाईं खानुहुन्छ** (`tapai\\nkhanuhunchha`, \\"you eat\\"). Third person is `-न्छ` / `-न्छिन्` (he / she).\\n\\nTwo things to drill hard:\\n\\n1. **Word order.** Object before verb, always. \\"I drink tea\\" = *म चिया\\n   पिउँछु* (I tea drink).\\n2. **The `-न` infinitive** for \\"to be able to\\" and \\"want to\\": *म पढ्न सक्छु*\\n   (I read-can), *म जान चाहन्छु* (I go-want).","source_path":"C:\\\\Users\\\\phill\\\\OneDrive\\\\Documents\\\\Code\\\\Scratch\\\\Nepali\\\\content\\\\lessons\\\\day05-sentence-drills.md"},"day06-questions":{"id":"day06-questions","title":"Day 6: Asking Questions","week":1,"day":6,"skill_type":"sentence-pattern","tags":["questions","production"],"vocab_categories":["questions","people","places","food","feelings"],"difficulty":1,"prerequisites":["day04-sentence-patterns","day05-sentence-drills"],"estimated_minutes":60,"status":"final","vocab_count":21,"pattern_count":4,"span_count":9,"character_count":0,"has_audio_content":true,"progress_status":"not_started","times_practiced":0,"due_vocab_count":0,"vocab":[{"id":"के-questions","devanagari":"के","romanized":"ke","english":"what","category":"questions","notes":null,"alt_romanizations":[],"source_lesson_id":"day06-questions","introduced_week":1},{"id":"को-questions","devanagari":"को","romanized":"ko","english":"who","category":"questions","notes":null,"alt_romanizations":[],"source_lesson_id":"day06-questions","introduced_week":1},{"id":"कहाँ-questions","devanagari":"कहाँ","romanized":"kahan","english":"where","category":"questions","notes":"alt: kaha, kahaan","alt_romanizations":["kaha","kahaan"],"source_lesson_id":"day06-ques ve?","blank_devanagari":"बस्नुहुन्छ?","blank_romanized":"basnuhunchha?"},{"devanagari":"तपाईं कहाँ जानुहुन्छ?","romanized":"Tapai kahan januhunchha?","english":"Where are you going?","blank_devanagari":"जानुहुन्छ?","blank_romanized":"januhunchha?"},{"devanagari":"तपाईं कहाँ काम गर्नुहुन्छ?","romanized":"Tapai kahan kaam garnuhunchha?","english":"Where do you work?","blank_devanagari":"काम गर्नुहुन्छ?","blank_romanized":"kaam garnuhunchha?"}]}],"turns":[{"turn_index":0,"speaker":"Grahak","spans":[{"id":"day06-questions:0:0","turn_index":0,"span_index":0,"devanagari":"नमस्ते दिदी।","romanized":"Namaste didi.","english":"Hello (elder sister)."},{"id":"day06-questions:0:1","turn_index":0,"span_index":1,"devanagari":"स्याउ कति पर्छ?","romanized":"Syau kati parchha?","english":"How much are the apples?"}]},{"turn_index":1,"speaker":"Pasale","spans":[{"id":"day06-questions:1:0","turn_index":1,"span_index":0,"devanagari":"एक किलोको दुई सय रुपैयाँ।","romanized":"Ek kiloko dui saya rupaiyan.","english":"Two hundred rupees per kilo."}]},{"turn_index":2,"speaker":"Grahak","spans":[{"id":"day06-questions:2:0","turn_index":2,"span_index":0,"devanagari":"अलि महँगो भयो।","romanized":"Ali mahango bhayo.","english":"That\'s a bit expensive."},{"id":"day06-questions:2:1","turn_index":2,"span_index":1,"devanagari":"दुई किलो दिनुहोस्।","romanized":"Dui kilo dinuhos.","english":"Give me two kilos."}]},{"turn_index":3,"speaker":"Pasale","spans":[{"id":"day06-questions:3:0","turn_index":3,"span_index":0,"devanagari":"हुन्छ।","romanized":"Hunchha.","english":"Okay."},{"id":"day06-questions:3:1","turn_index":3,"span_index":1,"devanagari":"अरू केही चाहियो?","romanized":"Aru kehi chahiyo?","english":"Do you need anything else?"}]},{"turn_index":4,"speaker":"Grahak","spans":[{"id":"day06-questions:4:0","turn_index":4,"span_index":0,"devanagari":"अहँ, त्यति भए पुग्छ।","romanized":"Aha, tyati bhaye pugchha.","english":"No, that\'s enough."},{"id":"day06-questions:4:1","turn_index":4,"span_index":1,"devanagari":"धन्यवाद।","romanized":"Dhanyabaad.","english":"Thank you."}]}],"characters":[],"is_dialogue":true,"notes_markdown":"## Notes\\nNepali question words all start with **क** (`k`), which makes them easy to\\ngroup: के / को / कहाँ / कहिले / किन / कसरी / कति / कुन / कस्तो.\\n\\nTwo rules make questions much easier than they look:\\n\\n1. **Word order does not change.** A statement becomes a question by swapping in\\n   a question word where the answer would go: *यो राम्रो छ* (\\"this is good\\") →\\n   *यो कस्तो छ?* (\\"how is this?\\").\\n2. **Yes/no questions** just add a rising tone, or the particle **नि** or a\\n   question mark in writing. *तपाईंलाई चिया मन पर्छ* → *तपाईंलाई चिया मन पर्छ?*\\n\\nThe verb still comes last, so the question word usually sits in the middle, not\\nthe front: *तपाईंको नाम **के** हो?* not \\"*के तपाईंको नाम हो?*\\".","source_path":"C:\\\\Users\\\\phill\\\\OneDrive\\\\Documents\\\\Code\\\\Scratch\\\\Nepali\\\\content\\\\lessons\\\\day06-questions.md"},"day07-week1-review":{"id":"day07-week1-review","title":"Day 7: Week 1 Review","week":1,"day":7,"skill_type":"conversation","tags":["review","conversation"],"vocab_categories":["people","food","places","time","social","feelings"],"difficulty":1,"prerequisites":["day01-pronunciation","day02-survival-phrases","day03-core-words","day04-sentence-patterns","day05-sentence-drills","day06-questions"],"estimated_minutes":60,"status":"final","vocab_count":13,"pattern_count":3,"span_count":18,"character_count":0,"has_audio_content":true,"progress_status":"not_started","times_practiced":0,"due_vocab_count":0,"vocab":[{"id":"अनि-social","devanagari":"अनि","romanized":"ani","english":"and then / so","category":"social","notes":null,"alt_romanizations":[],"source_lesson_id":"day07-week1-review","introduced_week":1},{"id":"तर-social","devanagari":"तर","romanized":"tara","english":"but","category":"social","notes":null,"alt_romanizations":[],"source_lesson_id":"day07-week1-review","introduced_we t meeting between\\na Nepali speaker and a foreign learner.\\n\\nWork it in three passes:\\n\\n1. Listen with all three lines visible.\\n2. Hide the English and shadow each line aloud.\\n3. Cover Ram\'s lines and try to produce them yourself before revealing.\\n\\nThe only new words are the connectives — **अनि, तर, किनभने, त्यसैले, पनि** —\\nwhich are what turn a list of sentences into actual speech. Drill those.\\n\\nWeek 1 self-check — you should be able to, without looking:\\n\\n- Greet someone and give your name and country\\n- Ask and answer \\"how are you\\" and \\"what\'s your name\\"\\n- Ask where something is and how much it costs\\n- Say what you like, need, and want\\n- Say what you do in a normal day","source_path":"C:\\\\Users\\\\phill\\\\OneDrive\\\\Documents\\\\Code\\\\Scratch\\\\Nepali\\\\content\\\\lessons\\\\day07-week1-review.md"},"day09-directions":{"id":"day09-directions","title":"Day 9: Asking for Directions","week":2,"day":9,"skill_type":"conversation","tags":["directions","survival"],"vocab_categories":["places","questions","verbs","feelings"],"difficulty":2,"prerequisites":["day07-week1-review","week02-conversation-cafe"],"estimated_minutes":50,"status":"final","vocab_count":20,"pattern_count":3,"span_count":10,"character_count":0,"has_audio_content":true,"progress_status":"not_started","times_practiced":0,"due_vocab_count":0,"vocab":[{"id":"दायाँ-places","devanagari":"दायाँ","romanized":"dayan","english":"right","category":"places","notes":"alt: daya","alt_romanizations":["daya"],"source_lesson_id":"day09-directions","introduced_week":2},{"id":"बायाँ-places","devanagari":"बायाँ","romanized":"bayan","english":"left","category":"places","notes":"alt: baya","alt_romanizations":["baya"],"source_lesson_id":"day09-directions","introduced_week":2},{"id":"सिधा-places","devanagari":"सिधा","romanized":"sidha","english":"straight","category":"places","notes":null,"alt_romanizations":[],"source_lesson_id":"day09-directions","introduced_week":2},{"id":" ht at the first intersection."}]},{"turn_index":2,"speaker":"Traveller","spans":[{"id":"day09-directions:2:0","turn_index":2,"span_index":0,"devanagari":"कति टाढा छ?","romanized":"Kati tadha chha?","english":"How far is it?"},{"id":"day09-directions:2:1","turn_index":2,"span_index":1,"devanagari":"म हिँडेर जान सक्छु?","romanized":"Ma hindera jana sakchhu?","english":"Can I walk there?"}]},{"turn_index":3,"speaker":"Passerby","spans":[{"id":"day09-directions:3:0","turn_index":3,"span_index":0,"devanagari":"नजिकै छ।","romanized":"Najikai chha.","english":"It\'s close."},{"id":"day09-directions:3:1","turn_index":3,"span_index":1,"devanagari":"दस मिनेटमा पुगिन्छ।","romanized":"Das minetma puginchha.","english":"You\'ll get there in ten minutes."}]},{"turn_index":4,"speaker":"Traveller","spans":[{"id":"day09-directions:4:0","turn_index":4,"span_index":0,"devanagari":"धेरै धन्यवाद।","romanized":"Dherai dhanyabaad.","english":"Thank you very much."},{"id":"day09-directions:4:1","turn_index":4,"span_index":1,"devanagari":"अलि बिस्तारै फेरि भन्नुहोस् है।","romanized":"Ali bistarai pheri bhannuhos hai.","english":"Please say it again slowly."}]},{"turn_index":5,"speaker":"Passerby","spans":[{"id":"day09-directions:5:0","turn_index":5,"span_index":0,"devanagari":"हुन्छ।","romanized":"Hunchha.","english":"Okay."},{"id":"day09-directions:5:1","turn_index":5,"span_index":1,"devanagari":"सिधा, अनि पहिलो चोकमा दायाँ।","romanized":"Sidha, ani pahilo chokma dayan.","english":"Straight, then right at the first intersection."}]}],"characters":[],"is_dialogue":true,"notes_markdown":"## Notes\\nDirections in Nepali lean on a small set of position words plus the postposition\\n**-तिर** (`-tira`, \\"towards\\"): *दायाँतिर* \\"to the right\\", *बायाँतिर* \\"to the\\nleft\\", *सिधा* \\"straight\\".\\n\\nThe key verbs:\\n\\n- **जानु** (`janu`) \\"to go\\" — *सिधा जानुहोस्* \\"go straight\\"\\n- **मोड्नु** (`modnu`) \\"to turn\\" — *दायाँ मोड्नुहोस्* \\"turn right\\"\\n- **पुग्नु** (`pugnu`) \
